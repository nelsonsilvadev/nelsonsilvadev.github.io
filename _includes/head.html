<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
    } catch (_) {}
  </script>
  {% seo %}
  <link
    rel="icon"
    href="{{ '/favicon.ico' | relative_url }}?v=photo-round"
    sizes="16x16 32x32 48x48" />
  <link
    rel="icon"
    href="{{ '/assets/img/favicon.svg' | relative_url }}?v=photo-round"
    type="image/svg+xml"
    sizes="any" />
  <link
    rel="apple-touch-icon"
    href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}?v=photo-round"
    sizes="180x180" />
  <link rel="manifest" href="{{ '/assets/img/site.webmanifest' | relative_url }}?v=photo-round" />
  <meta
    name="msapplication-config"
    content="{{ '/assets/img/browserconfig.xml' | relative_url }}?v=photo-round" />
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  {% if jekyll.environment == 'production' and site.google.tag_manager %}
  <script>
    (function (w, d, s, l, i) {
      w[l] = w[l] || [];
      w[l].push({
        "gtm.start": new Date().getTime(),
        event: "gtm.js",
      });
      var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s),
        dl = l != "dataLayer" ? "&l=" + l : "";
      j.async = true;
      j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
      f.parentNode.insertBefore(j, f);
    })(window, document, "script", "dataLayer", "{{ site.google.tag_manager }}");
  </script>
  {% endif %}
</head>
