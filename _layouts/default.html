<!doctype html>
<html lang="en">
  {% include head.html %}
  <body>
    {% if jekyll.environment == 'production' and site.google.tag_manager %}
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id={{ site.google.tag_manager }}"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
        title="Google Tag Manager"></iframe>
    </noscript>
    {% endif %}
    <a class="skip-link" href="#main">Skip to content</a>
    {% include navigation.html %}
    <main id="main" tabindex="-1">{{ content }}</main>
    {% include footer.html %} {% include scripts.html %}
  </body>
</html>
